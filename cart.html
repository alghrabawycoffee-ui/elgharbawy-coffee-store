<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات | الغرباوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #8A3324; --primary-dark: #5A1F14; --secondary: #D4A373; --bg-light: #FAFAFA; --text-dark: #1A1A1A; --text-muted: #777; --white: #ffffff; --shadow-sm: 0 4px 10px rgba(0,0,0,0.05); --transition: all 0.3s ease; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }
        a { text-decoration: none; color: inherit; }
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); margin-bottom: 40px; }
        .logo img { height: 60px; object-fit: contain; }
        .header-icons { position: relative; font-size: 1.3rem; }
        #cart-icon[data-count]:not([data-count="0"])::after { content: attr(data-count); position: absolute; top: -8px; right: -12px; background-color: var(--secondary); color: var(--primary-dark); font-size: 0.75rem; font-weight: 900; width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .page-title { text-align: center; font-size: 2rem; font-weight: 900; color: var(--primary-dark); margin-bottom: 40px; }
        .cart-container { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; padding: 0 5% 80px; }
        .cart-items { background: var(--white); border-radius: 15px; padding: 20px; box-shadow: var(--shadow-sm); }
        .cart-item { display: grid; grid-template-columns: 100px 2fr 1fr 1fr 50px; align-items: center; gap: 20px; border-bottom: 1px solid #eee; padding: 20px 0; }
        .cart-item:last-child { border-bottom: none; padding-bottom: 0; }
        .cart-item img { width: 100%; height: 100px; object-fit: contain; background: #f9f9f9; border-radius: 10px; }
        .cart-item-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 5px; }
        .cart-item-price { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
        .qty-control { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 5px; width: fit-content; }
        .qty-control button { width: 30px; height: 30px; background: none; border: none; cursor: pointer; font-weight: bold; }
        .qty-control span { width: 30px; text-align: center; font-weight: bold; }
        .remove-btn { background: #ffebee; color: #d32f2f; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; transition: var(--transition); }
        .remove-btn:hover { background: #d32f2f; color: white; }
        .cart-summary { background: var(--white); border-radius: 15px; padding: 30px; box-shadow: var(--shadow-sm); height: fit-content; position: sticky; top: 20px; }
        .cart-summary h2 { font-size: 1.3rem; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 600; color: var(--text-muted); }
        .summary-row.total { font-size: 1.3rem; font-weight: 900; color: var(--primary-dark); border-top: 2px dashed #eee; padding-top: 15px; margin-bottom: 25px; }
        .checkout-btn { width: 100%; padding: 15px; background: var(--primary); color: var(--white); border: none; border-radius: 8px; font-family: 'Cairo'; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .checkout-btn:hover { background: var(--primary-dark); }
        @media (max-width: 992px) {
            .cart-container { grid-template-columns: 1fr; }
            .cart-item { grid-template-columns: 80px 1fr; gap: 15px; }
            .cart-item-price, .qty-control, .remove-btn { grid-column: 2; margin-top: 10px; }
            .remove-btn { justify-self: end; margin-top: -40px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo"><img src="logo.jpg" alt="الغرباوي"></a>
        <div class="header-icons"><a href="cart.html"><i class="fas fa-shopping-bag" id="cart-icon"></i></a></div>
    </header>
    
    <h1 class="page-title">سلة المشتريات</h1>
    
    <section class="cart-container">
        <div class="cart-items" id="cart-items-container">
            <!-- سيتم رسم المنتجات هنا ديناميكياً -->
        </div>
        
        <div class="cart-summary">
            <h2>ملخص الطلب</h2>
            <div class="summary-row"><span>المجموع الفرعي</span><span id="subtotal">0.00 ج.م</span></div>
            <div class="summary-row"><span>الشحن</span><span>50.00 ج.م</span></div>
            <div class="summary-row total"><span>الإجمالي</span><span id="total">0.00 ج.م</span></div>
            <button class="checkout-btn" onclick="window.location.href='checkout.html'">إتمام الطلب <i class="fas fa-arrow-left"></i></button>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        function renderCartPage() {
            let cart = getCart();
            let container = document.getElementById('cart-items-container');
            let subtotal = 0;
            
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<h2 style="text-align:center; padding: 50px; color: #777;">سلة المشتريات فارغة 🛒<br><a href="index.html" style="color: var(--primary); font-size: 1rem; text-decoration: underline; margin-top: 20px; display: inline-block;">اضغط هنا للتسوق</a></h2>';
                document.getElementById('subtotal').innerText = '0.00 ج.م';
                document.getElementById('total').innerText = '50.00 ج.م'; // قيمة الشحن الثابتة
                return;
            }

            cart.forEach(item => {
                subtotal += item.price * item.quantity;
                container.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div><div class="cart-item-title">${item.name}</div></div>
                        <div class="cart-item-price">${item.price} ج.م</div>
                        <div class="qty-control">
                            <button onclick="changeQty('${item.id}', -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQty('${item.id}', 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem('${item.id}')"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            });

            document.getElementById('subtotal').innerText = subtotal + ' ج.م';
            document.getElementById('total').innerText = (subtotal + 50) + ' ج.م'; // إضافة 50 ج.م شحن
        }

        document.addEventListener('DOMContentLoaded', renderCartPage);
    </script>
</body>
</html>
