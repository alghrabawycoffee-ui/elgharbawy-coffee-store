<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | الغرباوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #8A3324; --primary-dark: #5A1F14; --secondary: #D4A373; --bg-light: #FAFAFA; --text-dark: #1A1A1A; --text-muted: #777; --white: #ffffff; --shadow-sm: 0 4px 15px rgba(0,0,0,0.05); --transition: all 0.3s ease; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }
        a { text-decoration: none; color: inherit; }
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); margin-bottom: 40px; }
        .logo img { height: 60px; object-fit: contain; }
        .checkout-container { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; padding: 0 5% 80px; max-width: 1200px; margin: 0 auto; }
        .checkout-form { background: var(--white); padding: 30px; border-radius: 15px; box-shadow: var(--shadow-sm); }
        .form-section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: var(--primary-dark); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.95rem; }
        .input-group input, .input-group select { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; font-size: 1rem; outline: none; transition: var(--transition); }
        .input-group input:focus { border-color: var(--primary); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .payment-methods { margin-top: 30px; }
        .payment-option { display: flex; align-items: center; gap: 15px; padding: 15px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 15px; cursor: pointer; transition: var(--transition); }
        .payment-option:hover { border-color: var(--secondary); }
        .payment-option.active { border-color: var(--primary); background: #fff8f0; }
        .payment-option input[type="radio"] { accent-color: var(--primary); width: 20px; height: 20px; }
        .payment-option label { font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; }
        .payment-option i { font-size: 1.5rem; color: var(--text-muted); }
        .order-summary { background: var(--white); padding: 30px; border-radius: 15px; box-shadow: var(--shadow-sm); height: fit-content; }
        .summary-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .summary-item img { width: 60px; height: 60px; object-fit: contain; background: #f9f9f9; border-radius: 8px; padding: 5px; }
        .summary-item-info { flex: 1; margin-right: 15px; }
        .summary-item-info h4 { font-size: 0.95rem; margin-bottom: 5px; }
        .summary-item-price { font-weight: 800; color: var(--primary); }
        .divider { height: 1px; background: #eee; margin: 20px 0; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 900; color: var(--primary-dark); }
        .place-order-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-family: 'Cairo'; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: var(--transition); margin-top: 25px; }
        .place-order-btn:hover { background: var(--primary-dark); }
        @media (max-width: 992px) { .checkout-container { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a href="cart.html" style="color: var(--text-muted); font-weight: bold;"><i class="fas fa-arrow-right"></i> العودة للسلة</a>
        <a href="index.html" class="logo"><img src="logo.jpg" alt="الغرباوي"></a>
        <div style="font-size: 1.2rem;"><i class="fas fa-lock" style="color: #4CAF50;"></i> دفع آمن</div>
    </header>

    <section class="checkout-container">
        <div class="checkout-form">
            <h2 class="form-section-title">بيانات التوصيل</h2>
            <div class="row">
                <div class="input-group"><label>الاسم بالكامل</label><input type="text" placeholder="مثال: أحمد محمد" required></div>
                <div class="input-group"><label>رقم الموبايل</label><input type="tel" placeholder="01xxxxxxxxx" required></div>
            </div>
            <div class="input-group"><label>البريد الإلكتروني (اختياري)</label><input type="email" placeholder="example@email.com"></div>
            <div class="row">
                <div class="input-group"><label>المحافظة</label><select><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option></select></div>
                <div class="input-group"><label>المدينة / المنطقة</label><input type="text" placeholder="مثال: مدينة نصر"></div>
            </div>
            <div class="input-group"><label>العنوان بالتفصيل</label><input type="text" placeholder="اسم الشارع، رقم العمارة، الدور، الشقة"></div>

            <h2 class="form-section-title" style="margin-top: 40px;">طريقة الدفع</h2>
            <div class="payment-methods">
                <label class="payment-option active"><input type="radio" name="payment" checked><i class="fas fa-money-bill-wave"></i><span>الدفع عند الاستلام (كاش)</span></label>
                <label class="payment-option"><input type="radio" name="payment"><i class="fas fa-credit-card"></i><span>بطاقة ائتمانية (فيزا / ماستركارد)</span></label>
                <label class="payment-option"><input type="radio" name="payment"><i class="fas fa-mobile-alt"></i><span>محفظة إلكترونية (فودافون كاش)</span></label>
            </div>
        </div>

        <div class="order-summary">
            <h2 class="form-section-title">ملخص الطلب</h2>
            <div id="checkout-summary-items">
                <!-- سيتم رسم المنتجات هنا -->
            </div>
            <div class="divider"></div>
            <div class="total-row">
                <span>الإجمالي</span>
                <span id="checkout-total">0 ج.م</span>
            </div>
            <button class="place-order-btn" onclick="placeOrder()">تأكيد الطلب</button>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.querySelectorAll('.payment-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
            });
        });

        function renderCheckoutSummary() {
            let cart = getCart();
            let container = document.getElementById('checkout-summary-items');
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p style="color:#777; text-align:center;">لا توجد منتجات في السلة.</p>';
                document.getElementById('checkout-total').innerText = '0 ج.م';
                return;
            }

            cart.forEach(item => {
                total += item.price * item.quantity;
                container.innerHTML += `
                    <div class="summary-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="summary-item-info">
                            <h4>${item.name}</h4>
                            <p>الكمية: ${item.quantity}</p>
                        </div>
                        <div class="summary-item-price">${item.price * item.quantity} ج.م</div>
                    </div>
                `;
            });
            total += 50; // إضافة الشحن
            document.getElementById('checkout-total').innerText = total + ' ج.م';
        }

        function placeOrder() {
            let cart = getCart();
            if (cart.length === 0) {
                alert("السلة فارغة! يرجى إضافة منتجات أولاً.");
                return;
            }
            // مسح السلة بعد الطلب
            localStorage.removeItem('elgharbawy_cart');
            alert('🎉 تم استلام طلبك بنجاح! سيتم التواصل معك قريباً لتأكيد التوصيل.');
            window.location.href = 'index.html'; // العودة للرئيسية
        }

        document.addEventListener('DOMContentLoaded', renderCheckoutSummary);
    </script>
</body>
</html>
