<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | الغرباوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8A3324; --primary-dark: #5A1F14; --secondary: #D4A373;
            --bg-light: #FAFAFA; --text-dark: #1A1A1A; --text-muted: #777;
            --white: #ffffff; --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }
        a { text-decoration: none; color: inherit; }

        /* الهيدر */
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); margin-bottom: 40px; }
        .logo h1 { color: var(--primary); font-size: 2rem; font-weight: 900; }
        
        .checkout-container { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; padding: 0 5% 80px; max-width: 1200px; margin: 0 auto; }

        /* فورم البيانات */
        .checkout-form { background: var(--white); padding: 30px; border-radius: 15px; box-shadow: var(--shadow-sm); }
        .form-section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: var(--primary-dark); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.95rem; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px;
            font-family: 'Cairo'; font-size: 1rem; outline: none; transition: var(--transition);
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(138, 51, 36, 0.1); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* طرق الدفع */
        .payment-methods { margin-top: 30px; }
        .payment-option {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            border: 2px solid #eee; border-radius: 10px; margin-bottom: 15px; cursor: pointer; transition: var(--transition);
        }
        .payment-option:hover { border-color: var(--secondary); }
        .payment-option.active { border-color: var(--primary); background: #fff8f0; }
        .payment-option input[type="radio"] { accent-color: var(--primary); width: 20px; height: 20px; }
        .payment-option label { font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; }
        .payment-option i { font-size: 1.5rem; color: var(--text-muted); }

        /* ملخص الطلب */
        .order-summary { background: var(--white); padding: 30px; border-radius: 15px; box-shadow: var(--shadow-sm); height: fit-content; }
        .summary-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .summary-item img { width: 60px; height: 60px; object-fit: contain; background: #f9f9f9; border-radius: 8px; padding: 5px; }
        .summary-item-info { flex: 1; margin-right: 15px; }
        .summary-item-info h4 { font-size: 0.95rem; margin-bottom: 5px; }
        .summary-item-info p { font-size: 0.8rem; color: var(--text-muted); }
        .summary-item-price { font-weight: 800; color: var(--primary); }
        
        .divider { height: 1px; background: #eee; margin: 20px 0; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 900; color: var(--primary-dark); }
        
        .place-order-btn {
            width: 100%; padding: 15px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-family: 'Cairo'; font-size: 1.2rem;
            font-weight: 800; cursor: pointer; transition: var(--transition); margin-top: 25px;
        }
        .place-order-btn:hover { background: var(--primary-dark); }

        @media (max-width: 992px) {
            .checkout-container { grid-template-columns: 1fr; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <a href="cart.html" style="color: var(--text-muted); font-weight: bold;"><i class="fas fa-arrow-right"></i> العودة للسلة</a>
        <a href="index.html" class="logo"><h1>الغرباوي</h1></a>
        <div style="font-size: 1.2rem;"><i class="fas fa-lock" style="color: #4CAF50;"></i> دفع آمن</div>
    </header>

    <section class="checkout-container">
        
        <!-- الفورم -->
        <div class="checkout-form">
            <h2 class="form-section-title">بيانات التوصيل</h2>
            
            <div class="row">
                <div class="input-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" placeholder="مثال: أحمد محمد">
                </div>
                <div class="input-group">
                    <label>رقم الموبايل</label>
                    <input type="tel" placeholder="01xxxxxxxxx">
                </div>
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني (اختياري)</label>
                <input type="email" placeholder="example@email.com">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>المحافظة</label>
                    <select>
                        <option>القاهرة</option>
                        <option>الجيزة</option>
                        <option>الإسكندرية</option>
                        <option>الدقهلية</option>
                        <!-- ضيف باقي المحافظات -->
                    </select>
                </div>
                <div class="input-group">
                    <label>المدينة / المنطقة</label>
                    <input type="text" placeholder="مثال: مدينة نصر">
                </div>
            </div>

            <div class="input-group">
                <label>العنوان بالتفصيل</label>
                <input type="text" placeholder="اسم الشارع، رقم العمارة، الدور، الشقة">
            </div>

            <h2 class="form-section-title" style="margin-top: 40px;">طريقة الدفع</h2>
            <div class="payment-methods">
                <label class="payment-option active">
                    <input type="radio" name="payment" checked>
                    <i class="fas fa-money-bill-wave"></i>
                    <span>الدفع عند الاستلام (كاش)</span>
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment">
                    <i class="fas fa-credit-card"></i>
                    <span>بطاقة ائتمانية (فيزا / ماستركارد)</span>
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment">
                    <i class="fas fa-mobile-alt"></i>
                    <span>محفظة إلكترونية (فودافون كاش)</span>
                </label>
            </div>
        </div>

        <!-- ملخص الطلب -->
        <div class="order-summary">
            <h2 class="form-section-title">ملخص الطلب</h2>
            
            <div class="summary-item">
                <img src="https://sc01.alicdn.com/kf/Hfe6f403b5b8d4e2c9a9f43d031b03b6dO.png" alt="بن">
                <div class="summary-item-info">
                    <h4>بن كولومبي - وسط</h4>
                    <p>الكمية: 1</p>
                </div>
                <div class="summary-item-price">350 ج.م</div>
            </div>

            <div class="summary-item">
                <img src="https://sc04.alicdn.com/kf/H9f5a6c2b6d804f7f9a0e3f4b5c6d7e8fX.png" alt="V60">
                <div class="summary-item-info">
                    <h4>أداة V60</h4>
                    <p>الكمية: 1</p>
                </div>
                <div class="summary-item-price">650 ج.م</div>
            </div>

            <div class="divider"></div>

            <div class="summary-item" style="font-weight: 700; color: var(--text-muted);">
                <span>المجموع الفرعي</span>
                <span>1000 ج.م</span>
            </div>
            <div class="summary-item" style="font-weight: 700; color: var(--text-muted);">
                <span>الشحن</span>
                <span>50 ج.م</span>
            </div>

            <div class="divider"></div>

            <div class="total-row">
                <span>الإجمالي</span>
                <span>1050 ج.م</span>
            </div>

            <button class="place-order-btn" onclick="alert('تم استلام طلبك بنجاح! سيتم التواصل معك قريباً.')">
                تأكيد الطلب
            </button>
        </div>

    </section>

    <script>
        // تفاعل بسيط لطرق الدفع
        document.querySelectorAll('.payment-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
            });
        });
    </script>
</body>
</html>
