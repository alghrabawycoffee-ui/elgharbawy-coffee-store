<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن كولومبي | الغرباوي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #8A3324; --primary-dark: #5A1F14; --secondary: #D4A373; --bg-light: #FAFAFA; --text-dark: #1A1A1A; --text-muted: #777; --white: #ffffff; --shadow-sm: 0 4px 6px rgba(0,0,0,0.05); --transition: all 0.3s ease; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }
        a { text-decoration: none; color: inherit; }
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); }
        .logo img { height: 60px; object-fit: contain; }
        .header-icons { display: flex; gap: 20px; font-size: 1.3rem; color: var(--text-dark); }
        .header-icons a { color: inherit; }
        #cart-icon { position: relative; }
        #cart-icon[data-count]:not([data-count="0"])::after { content: attr(data-count); position: absolute; top: -8px; right: -12px; background-color: var(--secondary); color: var(--primary-dark); font-size: 0.75rem; font-weight: 900; width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .breadcrumb { padding: 20px 5%; font-size: 0.9rem; color: var(--text-muted); }
        .product-container { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; padding: 20px 5% 80px; }
        .product-gallery { display: flex; flex-direction: column; gap: 15px; }
        .main-image { background: var(--white); border-radius: 20px; padding: 40px; display: flex; justify-content: center; align-items: center; box-shadow: var(--shadow-sm); height: 500px; }
        .main-image img { width: 80%; object-fit: contain; }
        .product-details { padding-top: 20px; }
        .product-title { font-size: 2.5rem; font-weight: 900; margin-bottom: 15px; color: var(--primary-dark); }
        .rating { color: #FFB800; margin-bottom: 20px; font-size: 1.1rem; }
        .price-box { font-size: 2rem; font-weight: 900; color: var(--primary); margin-bottom: 20px; }
        .price-box del { font-size: 1.2rem; color: var(--text-muted); margin-right: 15px; }
        .description { color: var(--text-muted); line-height: 1.8; margin-bottom: 30px; font-size: 1.05rem; }
        .options-group { margin-bottom: 25px; }
        .options-label { font-weight: 800; margin-bottom: 10px; display: block; }
        .options-list { display: flex; gap: 15px; flex-wrap: wrap; }
        .option-btn { padding: 10px 25px; border: 2px solid #ddd; background: var(--white); border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: 700; transition: var(--transition); }
        .option-btn:hover, .option-btn.active { border-color: var(--primary); color: var(--primary); background: #fff8f0; }
        .purchase-actions { display: flex; gap: 20px; margin-top: 40px; align-items: center; }
        .quantity-selector { display: flex; align-items: center; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; height: 55px; }
        .quantity-selector button { width: 45px; height: 100%; background: #f9f9f9; border: none; font-size: 1.2rem; cursor: pointer; }
        .quantity-selector input { width: 60px; height: 100%; text-align: center; border: none; font-family: 'Cairo'; font-size: 1.2rem; font-weight: 700; outline: none; }
        .btn-add-cart { flex: 1; height: 55px; background: var(--primary); color: var(--white); border: none; border-radius: 8px; font-family: 'Cairo'; font-size: 1.2rem; font-weight: 800; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-add-cart:hover { background: var(--primary-dark); }
        .toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background-color: #333; color: white; padding: 15px 30px; border-radius: 50px; display: flex; align-items: center; gap: 15px; transition: 0.5s; z-index: 9999; }
        .toast.show { bottom: 30px; }
        @media (max-width: 992px) { .product-container { grid-template-columns: 1fr; gap: 30px; } .main-image { height: 350px; } }
    </style>
</head>
<body>
    <header>
        <div class="header-icons"><i class="fas fa-bars"></i></div>
        <a href="index.html" class="logo"><img src="logo.jpg" alt="الغرباوي"></a>
        <div class="header-icons">
            <a href="cart.html"><i class="fas fa-shopping-bag" id="cart-icon"></i></a>
        </div>
    </header>
    <div class="breadcrumb"><a href="index.html">الرئيسية</a> / <a href="#">حبوب القهوة</a> / <span>بن كولومبي</span></div>
    
    <section class="product-container">
        <div class="product-gallery">
            <div class="main-image"><img src="bag.png" alt="بن كولومبي"></div>
        </div>
        <div class="product-details">
            <h1 class="product-title">بن كولومبي - تحميص وسط</h1>
            <div class="rating"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i> <span>(4.5)</span></div>
            <div class="price-box">350.00 ج.م <del>450.00 ج.م</del></div>
            <p class="description">بن كولومبي مختص بنسبة 100%. يتميز بنكهات الكراميل والشوكولاتة مع حموضة معتدلة. محمص طازج يومياً لضمان أعلى جودة.</p>
            
            <div class="options-group">
                <span class="options-label">اختر الوزن:</span>
                <div class="options-list">
                    <button class="option-btn active">250 جرام</button>
                    <button class="option-btn">500 جرام</button>
                </div>
            </div>

            <div class="purchase-actions">
                <div class="quantity-selector">
                    <button onclick="changeQty(-1)">-</button>
                    <input type="number" id="qty" value="1" min="1" readonly>
                    <button onclick="changeQty(1)">+</button>
                </div>
                <!-- ربط الزرار بالسلة مع قراءة عدد الكمية -->
                <button class="btn-add-cart" onclick="addToCart('p1', 'بن كولومبي - تحميص وسط', 350, 'bag.png', parseInt(document.getElementById('qty').value))">
                    <i class="fas fa-shopping-cart"></i> أضف للسلة
                </button>
            </div>
        </div>
    </section>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toast-message"></span></div>

    <script>
        function changeQty(amount) {
            let qtyInput = document.getElementById('qty');
            let current = parseInt(qtyInput.value);
            if (current + amount >= 1) { qtyInput.value = current + amount; }
        }
        document.querySelectorAll('.options-list').forEach(list => {
            list.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    list.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
